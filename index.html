<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sunup</title>
  <meta name="description" content="A simple morning-routine game for ADHD brains. Get up, earn XP, cash out on Fridays.">
  <meta name="theme-color" content="#0D0F14">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sunup">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var saved = JSON.parse(localStorage.getItem('sunup.v1'));
      if (saved && saved.settings && saved.settings.theme) document.documentElement.dataset.theme = saved.settings.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" data-action="tab" data-tab="today" aria-label="Sunup — go to Today">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>Sunup</span>
      </button>
      <div class="top-stats">
        <button class="lv-chip" data-action="tab" data-tab="week" aria-label="Your level">Lv <b id="tb-level">1</b></button>
        <button class="xp-chip" data-action="tab" data-tab="store" aria-label="XP in the bank">
          <svg class="ic fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <b id="tb-bank">0</b><small id="tb-unit">XP</small>
        </button>
      </div>
    </header>

    <main id="view" aria-live="polite"></main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <button class="tab" data-action="tab" data-tab="today">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-action="tab" data-tab="week">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Week</span><i class="dot" hidden></i>
      </button>
      <button class="tab" data-action="tab" data-tab="store">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
        <span>Store</span><i class="dot" hidden></i>
      </button>
      <button class="tab" data-action="tab" data-tab="settings">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="ics.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
