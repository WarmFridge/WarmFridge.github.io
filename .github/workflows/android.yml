name: Android APK

# Builds Sunup for Android whenever the app changes, and publishes the APK as a GitHub Release.
# Latest download: https://github.com/WarmFridge/WarmFridge.github.io/releases/latest/download/sunup.apk
on:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'ics.js'
      - 'icons/**'
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy the web app into the Android project
        run: npm run sync

      - name: Use the permanent signing key (if one is set up)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sunup.keystore"
            echo "SUNUP_KEYSTORE=$RUNNER_TEMP/sunup.keystore" >> "$GITHUB_ENV"
            echo "Signing with the permanent key."
          else
            echo "No permanent key configured: signing with this build's own key."
          fi

      - name: Build APK
        working-directory: android-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SUNUP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUNUP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUNUP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/sunup.apk"
          ls -la "$GITHUB_WORKSPACE/sunup.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sunup-apk
          path: sunup.apk

      - name: Publish release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Install on your Android phone**
          1. Open this page on your phone and tap **sunup.apk** below.
          2. When Android asks, allow your browser to install apps ("Install unknown apps").
          3. Tap **Install**, open Sunup, set your alarm time, and allow notifications.

          Reminders ring even when the app is closed: wake-up at your alarm time, "1 minute left" nudges, keep-moving nudges during your routine, and the Friday check-in.
          NOTES
          gh release create "android-v1.0.${{ github.run_number }}" sunup.apk \
            --target "${{ github.sha }}" \
            --title "Sunup for Android 1.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
